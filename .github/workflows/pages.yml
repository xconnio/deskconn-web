name: Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: pages

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_REGISTRATION_PRIVATE_KEY: ${{ secrets.VITE_REGISTRATION_PRIVATE_KEY }}

      # Replaces docker-entrypoint.sh's runtime config.js and nginx's
      # try_files SPA fallback (Pages serves 404.html for unknown paths).
      - name: Runtime config and SPA fallback
        run: |
          cat > dist/config.js <<EOF
          window.__APP_CONFIG__ = {
            WAMP_WT_URL: "${{ vars.VITE_WAMP_WT_URL }}",
            WAMP_WT_CERT_URL: "${{ vars.VITE_WAMP_WT_CERT_URL }}",
            WAMP_REALM: "${{ secrets.VITE_WAMP_REALM }}",
            REGISTRATION_AUTHID: "${{ secrets.VITE_REGISTRATION_AUTHID }}"
          };
          EOF
          cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
