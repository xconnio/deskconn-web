name: Pages

on:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency: pages

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_REGISTRATION_PRIVATE_KEY: ${{ secrets.VITE_REGISTRATION_PRIVATE_KEY }}

      # Replaces docker-entrypoint.sh's runtime config.js and nginx's
      # try_files SPA fallback (Pages serves 404.html for unknown paths).
      - name: Runtime config and SPA fallback
        run: |
          cat > dist/config.js <<EOF
          window.__APP_CONFIG__ = {
            WAMP_WT_URL: "${{ secrets.VITE_WAMP_WT_URL }}",
            WAMP_WT_CERT_URL: "${{ secrets.VITE_WAMP_WT_CERT_URL }}",
            WAMP_REALM: "${{ secrets.VITE_WAMP_REALM }}",
            REGISTRATION_AUTHID: "${{ secrets.VITE_REGISTRATION_AUTHID }}"
          };
          EOF
          cp dist/index.html dist/404.html

      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: dist

      # A finalized upload can take a few seconds to appear in the run's artifact list.
      - name: Wait for Pages artifact
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          for attempt in {1..10}; do
            if ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT_NAME" \
              --jq '.artifacts[] | select(.expired == false) | .id') &&
              [[ -n "$PAGES_ARTIFACT_ID" && "$ids" == "$PAGES_ARTIFACT_ID" ]]; then
              exit 0
            fi
            if [[ "$attempt" -lt 10 ]]; then sleep 3; fi
          done
          echo "::error::Expected exactly one visible Pages artifact named $PAGES_ARTIFACT_NAME (ID $PAGES_ARTIFACT_ID)."
          exit 1

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
